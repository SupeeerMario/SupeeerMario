r APIs.</tspan></text><text x="48" y="292" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22"><tspan fill="#4cc9f0">Node.js</tspan><tspan fill="#c9d1d9"> for data pipelines.</tspan></text><text x="48" y="328" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22"><tspan fill="#8b949e">Currently going deeper into </tspan><tspan fill="#b5179e">DevOps</tspan><tspan fill="#8b949e">.</tspan></text><path d="M775 222H1095" stroke="#30363d" stroke-width="1.5"/><circle r="4" fill="#4cc9f0"><animateMotion path="M775 222H1095" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle><circle r="4" fill="#4cc9f0"><animateMotion path="M775 222H1095" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle><circle r="4" fill="#4cc9f0"><animateMotion path="M775 222H1095" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle><path d="M935 200 C935 130 775 130 775 200" fill="none" stroke="#8b949e" stroke-opacity="0.5" stroke-dasharray="4 5"/><text x="855" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8b949e">retry</text><circle r="4" fill="#b5179e" opacity="0"><animateMotion path="M935 200 C935 130 775 130 775 200" dur="7.2s" keyPoints="0;0;1;1" keyTimes="0;0.6;0.8;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.59;0.6;0.8;0.81;1" dur="7.2s" repeatCount="indefinite"/></circle><rect x="720" y="200" width="110" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="775" y="228" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#c9d1d9">queue</text><rect x="880" y="200" width="110" height="44" rx="10" fill="#161b22" stroke="#30363d"/