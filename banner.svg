<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161028"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="0.5" stop-color="#b5179e"/>
      <stop offset="1" stop-color="#4cc9f0"/>
      <animate attributeName="x1" values="0;-1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="0.5" stop-color="#b5179e"/>
      <stop offset="1" stop-color="#4cc9f0"/>
      <animate attributeName="y1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="12s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7209b7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7209b7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <ellipse cx="600" cy="130" rx="420" ry="140" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <!-- packets on faint rails -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M0 40H1200"/><path d="M0 220H1200"/>
    </g>
    <circle cy="40" r="2.5" fill="#4cc9f0"><animate attributeName="cx" values="-10;1210" dur="7s" repeatCount="indefinite"/></circle>
    <circle cy="40" r="2.5" fill="#4cc9f0" opacity="0.6"><animate attributeName="cx" values="-10;1210" dur="7s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cy="220" r="2.5" fill="#b5179e"><animate attributeName="cx" values="1210;-10" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="4" height="259" rx="2" fill="url(#accv)"/>

  <text x="600" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="96" font-weight="700" letter-spacing="10" fill="url(#acc)">KHALED</text>

  <text x="600" y="190" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#8b949e" letter-spacing="2">backend engineer · distributed systems<tspan fill="#b5179e">_<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
</svg>
